    </g>
    <g fill="#e5e7eb" font-family="Menlo, Consolas, monospace" font-size="14">
      <text x="16" y="82">notes/daily.md</text><text x="280" y="82">file</text><text x="374" y="82">14 KB</text><text x="488" y="82">4 KB</text><text x="622" y="82">none</text>
      <text x="16" y="124">notes/sources.json</text><text x="280" y="124">file</text><text x="374" y="124">8 KB</text><text x="488" y="124">2 KB</text><text x="622" y="124">none</text>
      <text x="16" y="166">exports/table.csv</text><text x="280" y="166">file</text><text x="374" y="166">31 KB</text><text x="488" y="166">6 KB</text><text x="622" y="166">none</text>
      <text x="16" y="208" fill="#fca5a5">../escape.txt</text><text x="280" y="208" fill="#fca5a5">file</text><text x="374" y="208" fill="#fca5a5">4 B</text><text x="488" y="208" fill="#fca5a5">4 B</text><text x="622" y="208" fill="#fca5a5">path</text>
    </g>
    <g stroke="#303641">
      <line x1="0" y1="42" x2="726" y2="42"/>
      <line x1="0" y1="96" x2="726" y2="96"/>
      <line x1="0" y1="138" x2="726" y2="138"/>
      <line x1="0" y1="180" x2="726" y2="180"/>
      <line x1="260" y1="0" x2="260" y2="324"/>
      <line x1="354" y1="0" x2="354" y2="324"/>
      <line x1="468" y1="0" x2="468" y2="324"/>
      <line x1="604" y1="0" x2="604" y2="324"/>
