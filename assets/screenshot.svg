    <text x="112" y="210" fill="#62d88f" font-weight="700">Inspect only</text>
    <text x="218" y="210" fill="#a8adb8">Contained files are not opened or extracted.</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <rect x="92" y="244" width="86" height="28" rx="14" fill="#252a32" stroke="#464c58"/>
    <text x="111" y="263" fill="#e5e7eb">128 items</text>
    <rect x="188" y="244" width="80" height="28" rx="14" fill="#252a32" stroke="#464c58"/>
    <text x="207" y="263" fill="#e5e7eb">96 files</text>
    <rect x="278" y="244" width="158" height="28" rx="14" fill="#252a32" stroke="#464c58"/>
    <text x="297" y="263" fill="#e5e7eb">42.3 MB unpacked</text>
    <rect x="446" y="244" width="102" height="28" rx="14" fill="#252a32" stroke="#464c58"/>
    <text x="465" y="263" fill="#e5e7eb">129.4:1</text>
    <text x="566" y="263" fill="#fbbf24">3 suspicious entries</text>
  </g>
  <g transform="translate(92 296)">
    <rect width="1096" height="72" rx="8" fill="#2a2519" stroke="#f59e0b"/>
    <text x="18" y="28" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Archive warnings</text>
    <text x="18" y="54" fill="#d6d3d1" font-family="Menlo, Consolas, monospace" font-size="14">../escape.txt: Path traversal segment detected.    huge.bin: Suspicious compression ratio: 256000.0:1.</text>
  </g>
  <g transform="translate(92 392)">
    <rect width="348" height="324" rx="8" fill="#171a20" stroke="#3a404b"/>
    <rect width="348" height="42" rx="8" fill="#262b34"/>
