<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Archive Viewer screenshot</title>
  <desc id="desc">A dark themed ZIP archive viewer with summary pills, warnings, a contents tree, and entry metadata table.</desc>
  <rect width="1280" height="820" fill="#1f2329"/>
  <rect x="58" y="58" width="1164" height="704" rx="14" fill="#20242b" stroke="#3a404b"/>
  <text x="92" y="112" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">research-bundle.zip</text>
  <text x="92" y="142" fill="#a8adb8" font-family="Menlo, Consolas, monospace" font-size="15">20_files/2026-06/research-bundle.zip</text>
  <rect x="844" y="86" width="216" height="38" rx="8" fill="#171a20" stroke="#3a404b"/>
  <text x="880" y="111" fill="#a8adb8" font-family="Inter, Arial, sans-serif" font-size="17">Filter path or .ext</text>
