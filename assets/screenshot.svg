      <text x="40" y="118">▾ notes</text>
      <text x="66" y="156">daily.md</text>
      <text x="66" y="194">sources.json</text>
      <text x="40" y="232">▾ exports</text>
      <text x="66" y="270">table.csv</text>
      <text x="40" y="308">⚠ ../escape.txt</text>
    </g>
